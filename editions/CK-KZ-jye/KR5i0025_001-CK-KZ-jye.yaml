body:
  text: 觀音大士蓮船經增刻道藏輯要觀音大士蓮船經敘古今之遠一道而已矣天下之大一道而已矣卽聖神之荷擔宇宙仙佛之理會心區亦一道而已矣而修道之士每分門別戶各相詆毀者何也蓋以本原不明罔識所以然之故耳然亦無怪其然也世鮮眞傳人何以了理無歸宿道何以明嗚呼斯事之不彰於人間也不知凡幾矣無惑乎至聖難得極詣難臻竟不見有一懷抱這箇者能渾渾於其際也吾也眞息永定片念俱亡以眞無之烏有渾含以一理之貫注應事照得當引斯人以成道乃傳妙經而發微首曰蓮蓋以蓮體之空潔堪以昭心之虛靈耳次曰船蓋以船舟之渡人足以喻道之濟世耳經者常也以蓮船之常道拔志士之沉淪夫亦惟是昌明道妙焉已矣是故聖典不秘也不傳亦傳難彰亦彰上中下平列三品要無非極詣工夫前中後分派九章大都係本原奥義曰窮理曰盡性曰至命此三步之所以然耳曰烹煉曰抽添曰火候又九候之層次地也至於大藥本換骨之仙丹至於鼎爐實成道之眞際若夫金丹一章則所謂古今不傳之秘也縱言難言之也不生不死之關頭不消不息之玄妙其道止一無耳不見夫眞凡相較乎眞理與凡氣較則眞理陽而凡氣陰窮理理窮則知覺眞而光明朗徹春温之和得矣不見夫理炁相較乎眞炁與眞理較則眞炁陽而眞理陰盡性性盡則行爲力而理炁壯夏炎之烈得矣至於至命一途則所謂還無者由此始矣烹之煉之抽之添之火候到而大藥全矣曰鼎曰鑪曰丹功夫極而眞息定矣秋景之澄清秋氣之收歛秋涼之平靜秋金之嚴肅不於是而得證妙果乎於戍歸藏於艮止伏於亥靜篤於坤虛極萬念俱渾朕兆悉無陰無以引之而消也將何以死陽無以誘之而息也將何以生渾渾然冥冥然寂然不動焉依依然幽幽然感而遂通焉則所謂金丹大道者乃於是而完矣嗚呼夫亦孰是無念者耶生生死死止此念耳有念則生死興無念則生死絕夫亦孰是無念者耶蓋無爲無難言其妙言剛極剛雖至剛者不能入言堅極堅雖至利者不能出言細極細雖至細者不能藏言大至大雖至大者不能載火不焚水不溺金石弗碍法力罔傷卻又至聖至靈無物不體且也至玄至妙無往弗能金丹之所以爲金丹也極詣之所以爲極詣也此吾著蓮船經之所以渡人者在是矣有緣子其勿忽諸有緣子其勿忽諸清夫先生蓮船經敘大士蓮船經之作也無非發明金丹大道而已金丹大道三教眞元斯義不皙至人難得則天地之所以爲天地者亦誰得而心其心哉嗚呼古今如此其長也宇宙如此其大也乃於兹而玄微不明乃於兹而極詣罔得乃於兹而聖學弗有乃於兹而妙果無人不亦造化之暗晦道脈之衰微已乎而世人猶貿貿不悟也而世人猶洋洋自得也從釋謗道從道謗釋從釋道謗儒門從儒門謗釋道要皆以非非非究未見其一是釋教者陰道也道教者陽道也儒教者神道也儒釋道者陰陽神也分之陰陽神三也合之陰陽神一也猶人只一身耳而精氣神悉備焉三教者天地之精氣神也亦何可少世之所以彼此相詆毀者無非不知其所然耳三教之爲三教總悉歸之於無而止焉儒言至德道言靈寶釋言金剛究不分乎這箇下手雖異成功無殊儒門以萬歸一釋道以一貫萬釋教以靜宰動道教以動制靜以萬歸一故以天下爲已任以一貫萬故以心區爲權衡以靜宰動故以清靜養眞元以動制靜故以活潑證妙果功夫一到皆歸息定顧斯詣之眞諦旣至秘至密而斯理之幽玄又至精至微不有指陳無由研究不有闡發無由尋繹大士以一理之相通而當此傳經之大任揚千載不傳之秘晰萬古未明之真誠能反覆而追維誠能竭力而精進則所謂人中之聖聖中之天者不於此而見之乎但以義理精深層次幽𣺌言辭雖然顯明趣味實難探討讀者仔細閱者詳參不然如盲者之對鏡頑石之陳甘究於已乎何益嗟嗟斯道至大也斯事至重也非大智慧人不足以語此非大根抵人不足以識此吾也奉命較証任恐難勝然而辭不敢辭勉爲著意是故且滌慮洗心焉是故更凝神靜志焉一切磋而精爽思清也再琢磨而智平慮空也顧此難言之言呌人從何着落如丸散之於醫生如病人之於丸散不有其引藥亦枉投於是乃依文衍義略爲解釋敢言盡義藴乎哉聊以彷彿其大概焉已矣然而餘欣未已反敘鄙懷願斯人乃於彷彿中而嚼其味焉則上帝之心遂彼大士之願足卽吾亦樂得而同處焉嗚呼亦安得斯人而共語斯道也乎
